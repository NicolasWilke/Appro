# Avisos por mail sin Cloud Functions (plan Spark).
# En un repositorio privado, GitHub da 2.000 minutos gratis por mes: cada 30 minutos son unos 1.500. Más seguido se pasa del cupo.
# Cada 30 minutos manda los avisos de pedidos nuevos; todos los días a las 8:00 (Argentina) manda el resumen diario.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  contenido completo del JSON de la cuenta de servicio
#   FIREBASE_PROJECT_ID       id del proyecto (por ejemplo, appro-xxxxx)
#   RESEND_API_KEY            clave de Resend
#   MAIL_FROM                 remitente verificado en Resend, por ejemplo: APPRO <avisos@tudominio.com.ar>
#   PUBLIC_URL                dirección pública del sitio, por ejemplo: https://appro.com.ar
name: Avisos por mail

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      resumen:
        description: 'Mandar el resumen diario en vez de los avisos inmediatos'
        type: boolean
        default: false

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Credenciales
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/clave.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Mandar avisos
        run: |
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ] || [ "${{ inputs.resumen }}" = "true" ]; then
            npm run avisos -- --resumen
          else
            npm run avisos
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/clave.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          MAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/clave.json"
